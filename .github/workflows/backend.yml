name: Backend

on:
  push:
    branches: [v4]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: openagents_workspace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: workspace/backend
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/openagents_workspace
      APP_ENV: production
      CORS_ORIGINS: https://app.placement-ai.com
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workspace/backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Validate migrations upgrade downgrade upgrade
        run: |
          alembic upgrade head
          alembic downgrade 062
          alembic upgrade head
      - run: pytest -p no:cacheprovider tests -q
      - run: git diff --check
