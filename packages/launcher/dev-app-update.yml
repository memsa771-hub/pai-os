# electron-updater reads this file instead of resources/app-update.yml when the
# app isn't packaged and `forceDevUpdateConfig` is set (see updater.ts), so a
# dev run can exercise the whole update flow without building an installer.
#
# The URL is INTENTIONALLY EMPTY. It used to be
# https://dl.openagents.org/launcher/stable — another product's release feed —
# so `npm run dev` downloaded OpenAgents-Launcher-<version>-win-x64.exe and
# announced it was ready to install over the Placement AI build.
#
# updater.ts now disables self-update entirely unless PAI_LAUNCHER_FEED is set,
# so this file is inert until Placement AI publishes a feed. When it does, put
# that URL here (and in PAI_LAUNCHER_FEED for the build) and the flow comes
# back on with no code change.
#
# Not shipped: package.json > build.files is an allow-list and doesn't include
# this file, so a release keeps using resources/app-update.yml.
provider: generic
url: ""
channel: latest
updaterCacheDirName: placement-ai-updater-dev
