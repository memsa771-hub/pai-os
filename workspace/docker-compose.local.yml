services:
  backend:
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_BASE_URL: http://localhost:3000
      PUBLIC_API_BASE: http://localhost:8000
      WORKSPACE_ENDPOINT: http://localhost:8000
      FILE_STORAGE_BACKEND: local
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    environment:
      APP_ENV: development
      FILE_STORAGE_BACKEND: local

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    ports:
      - "127.0.0.1:8080:80"
