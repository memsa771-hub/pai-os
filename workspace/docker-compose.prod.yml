services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/openagents_workspace
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PAI_ENABLED: ${PAI_ENABLED:-false}
      PAI_API_KEY: ${PAI_API_KEY:-}
      PAI_MODEL: ${PAI_MODEL:-gpt-5.4-mini}
      PAI_BASE_URL: ${PAI_BASE_URL:-https://api.openai.com/v1}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
      # The canonical hosted application origin, and nothing else. Never "*":
      # this API is credentialed.
      #
      # The desktop launcher does NOT need an entry. Its bundle is served from
      # pai://workspace, and the launcher rewrites that Origin to the
      # configured web origin before the request leaves the process, then
      # rewrites the reply header back — see
      # packages/launcher/src/main/workspace-bundle.ts (allowBundleApiAccess).
      # So desktop arrives as https://app.placement-ai.com, which is listed.
      #
      # Add https://placement-ai.com or https://www.placement-ai.com here only
      # if those origins actually call the API, rather than redirecting to the
      # app origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.placement-ai.com}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://api.placement-ai.com}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
