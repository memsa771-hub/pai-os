services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/openagents_workspace
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      CORS_ORIGINS: http://localhost:3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PAI_ENABLED: ${PAI_ENABLED:-false}
      PAI_API_KEY: ${PAI_API_KEY:-}
      PAI_MODEL: ${PAI_MODEL:-gpt-5.4-mini}
      PAI_BASE_URL: ${PAI_BASE_URL:-https://api.openai.com/v1}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
