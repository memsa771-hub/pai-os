# Shared by `backend` and `worker` so the two processes cannot drift apart â€”
# a worker running against a different DATABASE_URL or PAI config than the web
# process is a genuinely confusing failure.
x-backend-env: &backend-env
  DATABASE_URL: postgresql://postgres:dev@db:5432/openagents_workspace
  AUTH_MODE: workspace_token
  IDENTITY_MODE: standalone
  CORS_ORIGINS: http://localhost:3000
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
  PAI_ENABLED: ${PAI_ENABLED:-false}
  PAI_API_KEY: ${PAI_API_KEY:-}
  PAI_MODEL: ${PAI_MODEL:-gpt-5.4-mini}
  PAI_BASE_URL: ${PAI_BASE_URL:-https://api.openai.com/v1}
  # Transactional email (app/services/email.py). Feedback and feature requests
  # from workspace settings are forwarded to FEEDBACK_EMAIL_TO; EMAIL_FROM's
  # domain must be verified in Resend. Values live in .env, never here.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Placement AI <noreply@placement-ai.com>}
  FEEDBACK_EMAIL_TO: ${FEEDBACK_EMAIL_TO:-}
  WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
  WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
  WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-}
  # Derived memory retrieval index. Unset MEMORY_VECTOR_BACKEND -> NullMemoryIndex
  # and retrieval degrades to the existing structured/lexical paths.
  MEMORY_VECTOR_BACKEND: ${MEMORY_VECTOR_BACKEND:-}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-pai_memory}
  MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
  MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:-}
  MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
  MEMORY_EMBEDDING_DIM: ${MEMORY_EMBEDDING_DIM:-1536}
  MEMORY_RETRIEVAL_CANDIDATES: ${MEMORY_RETRIEVAL_CANDIDATES:-40}
  MEMORY_RETRIEVAL_LIMIT: ${MEMORY_RETRIEVAL_LIMIT:-8}
  MEMORY_RERANKER: ${MEMORY_RERANKER:-}
  # Foreground memory injection into PAI Counselor. OFF by default — see
  # docs/pai-memory-rollout.md. Background memory formation runs regardless.
  PAI_MEMORY_CONTEXT_ENABLED: ${PAI_MEMORY_CONTEXT_ENABLED:-false}
  PAI_MEMORY_CONTEXT_TIMEOUT_MS: ${PAI_MEMORY_CONTEXT_TIMEOUT_MS:-1500}
  PAI_MEMORY_CONTEXT_MAX_CHARS: ${PAI_MEMORY_CONTEXT_MAX_CHARS:-2500}
  PAI_MEMORY_FOREGROUND_WORKERS: ${PAI_MEMORY_FOREGROUND_WORKERS:-4}
  PAI_MEMORY_FOREGROUND_MAX_INFLIGHT: ${PAI_MEMORY_FOREGROUND_MAX_INFLIGHT:-8}
  # Redis is optional application state: cache, composing TTLs, webhook dedupe,
  # and Pub/Sub only. PostgreSQL remains canonical.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-0.5}
  REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-0.5}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Derived vector index for memory retrieval. Holds NO canonical data â€”
  # losing this volume costs a `memory.reindex`, never student memory.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image is distroless â€” no curl/wget â€” so probe the TCP port
      # with bash's /dev/tcp instead of an HTTP client that is not there.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Migrate before serving locally. Production uses a dedicated one-shot
    # migration service; a fresh local volume otherwise produces an empty
    # database and every request died on "relation users does not exist" while
    # the UI just said it could not reach the server. `alembic upgrade head` is
    # idempotent, so this is a no-op on an already-migrated volume.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Durable background job worker (PAI memory formation and anything else
  # enqueued into `background_jobs`). A SEPARATE process from the web service
  # on purpose: job handlers do slow work (LLM extraction in Phase 2), and the
  # web process caps its threadpool to match the DB pool so request latency is
  # never held hostage to background work.
  #
  # Safe to scale: `docker compose up -d --scale worker=3`. Claiming uses
  # FOR UPDATE SKIP LOCKED plus a renewed lease, so N workers never run the
  # same job twice.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      JOB_WORKER_POLL_SECONDS: ${JOB_WORKER_POLL_SECONDS:-2}
      JOB_WORKER_CONCURRENCY: ${JOB_WORKER_CONCURRENCY:-5}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Overrides the image ENTRYPOINT (which starts uvicorn).
    entrypoint: ["python", "-m", "app.jobs.worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_ENABLE_DMS: ${NEXT_PUBLIC_ENABLE_DMS:-false}
        NEXT_PUBLIC_ENABLE_INBOX: ${NEXT_PUBLIC_ENABLE_INBOX:-false}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  qdrant_data:
